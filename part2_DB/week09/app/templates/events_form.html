{% extends 'base.html' %}
{% block title %}Add event{% endblock %}
{% block content %}
<h1>Add an event</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" class="card">
    <label>Observer
        <select name="observer_id" required>
            <option value="">Choose an observer</option>
            {% for o in observers %}
            <option value="{{ o['observer_id'] }}"
                {% if form.get('observer_id') == o['observer_id']|string %}selected{% endif %}>{{ o['name'] }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Event type
        <select name="event_type" required>
            <option value="">Choose a type</option>
            {% for t in ['fishing', 'hunting', 'pets', 'sighting', 'pursuit'] %}
            <option value="{{ t }}" {% if form.get('event_type') == t %}selected{% endif %}>{{ t }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Date
        <input type="date" name="event_date" required value="{{ form.get('event_date', '') }}">
    </label>
    <label>Latitude (optional)
        <input type="number" name="lat" step="any" value="{{ form.get('lat', '') }}">
    </label>
    <label>Longitude (optional)
        <input type="number" name="long" step="any" value="{{ form.get('long', '') }}">
    </label>
    <button type="submit">Save event</button>
    <a href="{{ url_for('list_events') }}">Cancel</a>
</form>
{% endblock %}
