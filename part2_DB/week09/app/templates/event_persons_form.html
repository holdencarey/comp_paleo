{% extends 'base.html' %}
{% block title %}Link person to event{% endblock %}
{% block content %}
<h1>Link a person to an event</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" class="card">
    <label>Event
        <select name="event_id" required>
            <option value="">Choose an event</option>
            {% for e in events %}
            <option value="{{ e['event_id'] }}"
                {% if form.get('event_id') == e['event_id']|string %}selected{% endif %}>
                #{{ e['event_id'] }}: {{ e['event_type'] }} on {{ e['event_date'] }}
            </option>
            {% endfor %}
        </select>
    </label>
    <label>Person
        <select name="person_id" required>
            <option value="">Choose a person</option>
            {% for p in people %}
            <option value="{{ p['person_id'] }}"
                {% if form.get('person_id') == p['person_id']|string %}selected{% endif %}>{{ p['name'] }}</option>
            {% endfor %}
        </select>
    </label>
    <button type="submit">Save link</button>
    <a href="{{ url_for('list_event_persons') }}">Cancel</a>
</form>
{% endblock %}
